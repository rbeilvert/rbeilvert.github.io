name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve build output & check it responds
        run: |
          npm run preview -- --background --host 127.0.0.1 --port 4321 > preview.log 2>&1 || {
            echo "::error::preview server failed to start"
            cat preview.log
            exit 1
          }
          trap 'npm run preview -- stop > /dev/null 2>&1' EXIT

          check() {
            curl --fail --silent --show-error --max-time 30 \
              -o /dev/null "http://127.0.0.1:4321$1"
          }

          check / && check /sitemap-index.xml || {
            echo "::error::preview server did not respond"
            cat preview.log
            npm run preview -- logs 2>&1 | tail -50
            exit 1
          }
