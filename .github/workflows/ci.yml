name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve build output & check it responds
        run: |
          setsid npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          server=$!
          trap 'kill -- -$server 2>/dev/null' EXIT

          check() {
            curl --fail --silent --show-error --max-time 30 --retry 15 --retry-delay 1 \
              --retry-connrefused -o /dev/null "http://127.0.0.1:4321$1"
          }

          check / && check /sitemap-index.xml && kill -0 $server || {
            echo "::error::preview server failed"
            cat preview.log
            exit 1
          }
